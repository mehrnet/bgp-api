name: Import BGP Database

on:
  workflow_dispatch:
    inputs:
      producer_repository:
        description: GitHub repository that publishes mehrnet_bgp.tar.gz
        required: false
        type: string
      release_tag:
        description: Release tag to import, or latest
        required: true
        default: latest
        type: string
  repository_dispatch:
    types: [bgp_database_released]
  schedule:
    - cron: "23 3 * * 0"

permissions:
  contents: read

concurrency:
  group: bgp-database-import
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-latest
    env:
      PRODUCER_REPOSITORY: ${{ inputs.producer_repository || github.event.client_payload.producer_repository || vars.BGP_DATABASE_REPOSITORY }}
      RELEASE_TAG: ${{ inputs.release_tag || github.event.client_payload.release_tag || 'latest' }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.0"
      - run: bun install --frozen-lockfile
      - name: Download producer release
        env:
          # github.token cannot read releases from another private repository.
          GH_TOKEN: ${{ secrets.BGP_DATABASE_READ_TOKEN || github.token }}
        run: |
          test -n "$PRODUCER_REPOSITORY"
          mkdir database
          if [ "$RELEASE_TAG" = "latest" ]; then
            gh release download --repo "$PRODUCER_REPOSITORY" --pattern mehrnet_bgp.tar.gz --dir database
          else
            gh release download "$RELEASE_TAG" --repo "$PRODUCER_REPOSITORY" --pattern mehrnet_bgp.tar.gz --dir database
          fi
          tar -xzf database/mehrnet_bgp.tar.gz -C database
      - name: Validate source database
        run: bun run db:validate -- database/mehrnet_bgp.db
      - name: Build prefix lookup index
        run: bun run db:build-prefix-index -- database/mehrnet_bgp.db
      - name: Convert SQLite database to D1 SQL
        run: sqlite3 database/mehrnet_bgp.db '.dump allocations routes geolocations lookup_prefixes' > database/mehrnet_bgp.sql
      - name: Build secondary database
        run: |
          bunx wrangler d1 execute BGP_DB_SECONDARY --remote --command 'DROP TABLE IF EXISTS allocations; DROP TABLE IF EXISTS routes; DROP TABLE IF EXISTS geolocations; DROP TABLE IF EXISTS lookup_prefixes;'
          bunx wrangler d1 execute BGP_DB_SECONDARY --remote --file database/mehrnet_bgp.sql
          bunx wrangler d1 execute BGP_DB_SECONDARY --remote --command 'CREATE INDEX idx_lookup_prefix ON lookup_prefixes(source, prefix_key); ANALYZE;'
      - name: Validate secondary database
        run: |
          bunx wrangler d1 execute BGP_DB_SECONDARY --remote --json --command 'SELECT (SELECT count(*) FROM allocations) AS allocations, (SELECT count(*) FROM routes) AS routes, (SELECT count(*) FROM geolocations) AS geolocations;' > database/secondary-validation.json
          bun -e "const result = JSON.parse(await Bun.file('database/secondary-validation.json').text())[0]?.results?.[0]; if (!result || !result.allocations || !result.routes || !result.geolocations) throw new Error('secondary database validation failed');"
      - name: Deploy Worker against secondary
        run: bunx wrangler deploy --var ACTIVE_DATABASE:secondary
      - name: Build primary database
        run: |
          bunx wrangler d1 execute BGP_DB_PRIMARY --remote --command 'DROP TABLE IF EXISTS allocations; DROP TABLE IF EXISTS routes; DROP TABLE IF EXISTS geolocations; DROP TABLE IF EXISTS lookup_prefixes;'
          bunx wrangler d1 execute BGP_DB_PRIMARY --remote --file database/mehrnet_bgp.sql
          bunx wrangler d1 execute BGP_DB_PRIMARY --remote --command 'CREATE INDEX idx_lookup_prefix ON lookup_prefixes(source, prefix_key); ANALYZE;'
      - name: Validate primary database
        run: |
          bunx wrangler d1 execute BGP_DB_PRIMARY --remote --json --command 'SELECT (SELECT count(*) FROM allocations) AS allocations, (SELECT count(*) FROM routes) AS routes, (SELECT count(*) FROM geolocations) AS geolocations;' > database/primary-validation.json
          bun -e "const result = JSON.parse(await Bun.file('database/primary-validation.json').text())[0]?.results?.[0]; if (!result || !result.allocations || !result.routes || !result.geolocations) throw new Error('primary database validation failed');"
      - name: Deploy Worker against primary
        run: bunx wrangler deploy --var ACTIVE_DATABASE:primary
      - name: Rebuild standby secondary database
        run: |
          bunx wrangler d1 execute BGP_DB_SECONDARY --remote --command 'DROP TABLE IF EXISTS allocations; DROP TABLE IF EXISTS routes; DROP TABLE IF EXISTS geolocations; DROP TABLE IF EXISTS lookup_prefixes;'
          bunx wrangler d1 execute BGP_DB_SECONDARY --remote --file database/mehrnet_bgp.sql
          bunx wrangler d1 execute BGP_DB_SECONDARY --remote --command 'CREATE INDEX idx_lookup_prefix ON lookup_prefixes(source, prefix_key); ANALYZE;'
