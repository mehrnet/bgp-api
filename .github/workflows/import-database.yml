name: Import BGP Database

on:
  workflow_dispatch:
    inputs:
      producer_repository:
        description: GitHub repository that publishes mehrnet_bgp.tar.gz
        required: true
        type: string
      release_tag:
        description: Release tag to import, or latest
        required: true
        default: latest
        type: string
  repository_dispatch:
    types: [bgp_database_released]
  schedule:
    - cron: "23 3 * * 0"

permissions:
  contents: read

concurrency:
  group: bgp-database-import
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-latest
    env:
      PRODUCER_REPOSITORY: ${{ inputs.producer_repository || github.event.client_payload.producer_repository || vars.BGP_DATABASE_REPOSITORY }}
      RELEASE_TAG: ${{ inputs.release_tag || github.event.client_payload.release_tag || 'latest' }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.0"
      - run: bun install --frozen-lockfile
      - name: Download producer release
        env:
          # github.token cannot read releases from another private repository.
          GH_TOKEN: ${{ secrets.BGP_DATABASE_READ_TOKEN || github.token }}
        run: |
          test -n "$PRODUCER_REPOSITORY"
          mkdir database
          if [ "$RELEASE_TAG" = "latest" ]; then
            gh release download --repo "$PRODUCER_REPOSITORY" --pattern mehrnet_bgp.tar.gz --dir database
          else
            gh release download "$RELEASE_TAG" --repo "$PRODUCER_REPOSITORY" --pattern mehrnet_bgp.tar.gz --dir database
          fi
          tar -xzf database/mehrnet_bgp.tar.gz -C database
      - name: Validate source database
        run: bun run db:validate -- database/mehrnet_bgp.db
      - name: Convert SQLite database to D1 SQL
        run: sqlite3 database/mehrnet_bgp.db '.dump allocations routes geolocations' > database/mehrnet_bgp.sql
      - name: Replace D1 data
        # This intentionally only imports data. Deploying the Worker remains a
        # separate, explicit action after the D1 binding is provisioned.
        run: |
          bunx wrangler d1 execute BGP_DB --remote --command 'DROP TABLE IF EXISTS allocations; DROP TABLE IF EXISTS routes; DROP TABLE IF EXISTS geolocations;'
          bunx wrangler d1 execute BGP_DB --remote --file database/mehrnet_bgp.sql
          bunx wrangler d1 execute BGP_DB --remote --command 'CREATE INDEX IF NOT EXISTS idx_alloc_lookup ON allocations(ip_version, start_ip_sort, end_ip_sort); CREATE INDEX IF NOT EXISTS idx_routes_lookup ON routes(ip_version, start_ip_sort, end_ip_sort); CREATE INDEX IF NOT EXISTS idx_geo_lookup ON geolocations(ip_version, start_ip_sort, end_ip_sort); ANALYZE;'
