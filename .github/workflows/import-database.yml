name: Build and Publish BGP Database

on:
  workflow_dispatch:
  schedule:
    - cron: "0 4 * * *"

permissions:
  contents: write

concurrency:
  group: bgp-database-build
  cancel-in-progress: false

jobs:
  parse-rir:
    name: Parse ${{ matrix.rir }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        rir: [ripe, apnic, afrinic, lacnic, arin]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
      - name: Install download client
        run: sudo apt-get update && sudo apt-get install -y aria2
      - name: Select RIR source files
        run: |
          mkdir raw_data
          case "${{ matrix.rir }}" in
            ripe)
              printf '%s\n' \
                https://ftp.ripe.net/ripe/dbase/split/ripe.db.inetnum.gz \
                https://ftp.ripe.net/ripe/dbase/split/ripe.db.inet6num.gz \
                https://ftp.ripe.net/ripe/dbase/split/ripe.db.route.gz \
                https://ftp.ripe.net/ripe/dbase/split/ripe.db.route6.gz > urls.txt
              ;;
            apnic)
              printf '%s\n' \
                https://ftp.apnic.net/apnic/whois/apnic.db.inetnum.gz \
                https://ftp.apnic.net/apnic/whois/apnic.db.inet6num.gz \
                https://ftp.apnic.net/apnic/whois/apnic.db.route.gz \
                https://ftp.apnic.net/apnic/whois/apnic.db.route6.gz > urls.txt
              ;;
            afrinic)
              printf '%s\n' https://ftp.afrinic.net/pub/dbase/afrinic.db.gz > urls.txt
              ;;
            lacnic)
              printf '%s\n' https://ftp.lacnic.net/lacnic/dbase/lacnic.db.gz > urls.txt
              ;;
            arin)
              printf '%s\n' \
                https://ftp.arin.net/pub/stats/arin/delegated-arin-extended-latest \
                https://ftp.arin.net/pub/rr/arin.db.gz > urls.txt
              ;;
          esac
      - name: Download RIR data
        run: aria2c -x 16 -s 16 -j 5 --dir=raw_data --input-file=urls.txt
      - name: Parse allocations, routes, and geofeed URLs
        run: go run scripts/go/parse-rir.go ${{ matrix.rir }}
      - uses: actions/upload-artifact@v4
        with:
          name: data-${{ matrix.rir }}
          path: |
            allocations_${{ matrix.rir }}.csv
            routes_${{ matrix.rir }}.csv
            geofeeds_${{ matrix.rir }}.txt
          if-no-files-found: error

  build-release:
    needs: parse-rir
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.0"
      - name: Install SQLite
        run: sudo apt-get update && sudo apt-get install -y sqlite3
      - run: bun install --frozen-lockfile
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Merge RIR artifacts
        run: |
          mkdir final_data
          cat artifacts/allocations_*.csv > final_data/allocations.csv
          cat artifacts/routes_*.csv > final_data/routes.csv
          touch artifacts/geofeeds_dummy.txt
          cat artifacts/geofeeds_*.txt | sort -u > final_data/geofeeds.txt
      - name: Fetch geofeeds
        run: go run scripts/go/fetch-geofeeds.go
      - name: Build normal SQLite database
        run: |
          sqlite3 mehrnet_bgp.db <<'SQL'
          PRAGMA synchronous = OFF;
          PRAGMA journal_mode = MEMORY;
          CREATE TABLE allocations (start_ip_sort TEXT, end_ip_sort TEXT, ip_version INTEGER, registry TEXT, country TEXT, netname TEXT);
          CREATE TABLE routes (start_ip_sort TEXT, end_ip_sort TEXT, ip_version INTEGER, cidr TEXT, asn TEXT);
          CREATE TABLE geolocations (start_ip_sort TEXT, end_ip_sort TEXT, ip_version INTEGER, country TEXT, region TEXT, city TEXT);
          .mode csv
          .import final_data/allocations.csv allocations
          .import final_data/routes.csv routes
          .import final_data/geolocations.csv geolocations
          CREATE INDEX idx_alloc ON allocations(start_ip_sort);
          CREATE INDEX idx_routes ON routes(start_ip_sort);
          CREATE INDEX idx_geo ON geolocations(start_ip_sort);
          VACUUM;
          ANALYZE;
          SQL
          bun run db:validate -- mehrnet_bgp.db
      - name: Package normal database
        run: |
          mkdir release
          tar -czf release/mehrnet_bgp.tar.gz mehrnet_bgp.db
      - name: Build indexed database
        run: bun run db:build-prefix-index -- mehrnet_bgp.db
      - name: Package indexed database
        run: |
          tar -czf release/mehrnet_bgp_indexed.tar.gz mehrnet_bgp.db
          if [ "$(stat --format=%s release/mehrnet_bgp_indexed.tar.gz)" -ge 2040000000 ]; then
            split --bytes=1900m --numeric-suffixes=1 --suffix-length=2 release/mehrnet_bgp_indexed.tar.gz release/mehrnet_bgp_indexed.tar.gz.part-
            rm release/mehrnet_bgp_indexed.tar.gz
          fi
          sha256sum release/* > release/SHA256SUMS.txt
          echo "DATA_TAG=$(date -u +'%Y.%m.%d-%H%M')" >> "$GITHUB_ENV"
      - name: Publish database release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "db-${DATA_TAG}-${GITHUB_RUN_NUMBER}" release/* \
            --title "MehrNet BGP Database - ${DATA_TAG}" \
            --notes "Assets:
          - mehrnet_bgp.tar.gz: normal database.
          - mehrnet_bgp_indexed.tar.gz: range and prefix-indexed database.
          - SHA256SUMS.txt: SHA-256 checksums for all assets.

          If the indexed archive exceeds GitHub's per-asset limit, download every
          numbered mehrnet_bgp_indexed.tar.gz.part-* file and concatenate them."
