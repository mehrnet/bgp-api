name: Build and Publish BGP Database

on:
  workflow_dispatch:
  schedule:
    - cron: "0 4 * * *"

permissions:
  contents: write

concurrency:
  group: bgp-database-build
  cancel-in-progress: false

env:
  GH_REPO: ${{ github.repository }}

jobs:
  release-metadata:
    name: Create draft release
    runs-on: ubuntu-latest
    outputs:
      data_tag: ${{ steps.metadata.outputs.data_tag }}
      release_tag: ${{ steps.metadata.outputs.release_tag }}
      dataset_built_at: ${{ steps.metadata.outputs.dataset_built_at }}
    steps:
      - id: metadata
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          data_tag="$(date -u +'%Y.%m.%d-%H%M')"
          release_tag="db-${data_tag}-${GITHUB_RUN_NUMBER}"
          {
            echo "data_tag=$data_tag"
            echo "release_tag=$release_tag"
            echo "dataset_built_at=$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          } >> "$GITHUB_OUTPUT"
          gh release create "$release_tag" \
            --draft \
            --target "$GITHUB_SHA" \
            --title "MehrNet BGP Database - ${data_tag} (building)" \
            --notes "Database production is in progress. Assets are uploaded to this draft as they become ready."

  parse-rir:
    name: Parse ${{ matrix.rir }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        rir: [ripe, apnic, afrinic, lacnic, arin]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
      - name: Install download client
        run: sudo apt-get update && sudo apt-get install -y aria2
      - name: Select RIR source files
        run: |
          mkdir raw_data
          case "${{ matrix.rir }}" in
            ripe)
              printf '%s\n' \
                https://ftp.ripe.net/ripe/dbase/split/ripe.db.inetnum.gz \
                https://ftp.ripe.net/ripe/dbase/split/ripe.db.inet6num.gz \
                https://ftp.ripe.net/ripe/dbase/split/ripe.db.route.gz \
                https://ftp.ripe.net/ripe/dbase/split/ripe.db.route6.gz \
                https://ftp.ripe.net/ripe/dbase/split/ripe.db.aut-num.gz > urls.txt
              ;;
            apnic)
              printf '%s\n' \
                https://ftp.apnic.net/apnic/whois/apnic.db.inetnum.gz \
                https://ftp.apnic.net/apnic/whois/apnic.db.inet6num.gz \
                https://ftp.apnic.net/apnic/whois/apnic.db.route.gz \
                https://ftp.apnic.net/apnic/whois/apnic.db.route6.gz \
                https://ftp.apnic.net/apnic/whois/apnic.db.aut-num.gz > urls.txt
              ;;
            afrinic) printf '%s\n' https://ftp.afrinic.net/pub/dbase/afrinic.db.gz > urls.txt ;;
            lacnic) printf '%s\n' https://ftp.lacnic.net/lacnic/dbase/lacnic.db.gz > urls.txt ;;
            arin)
              printf '%s\n' \
                https://ftp.arin.net/pub/stats/arin/delegated-arin-extended-latest \
                https://ftp.arin.net/pub/rr/arin.db.gz > urls.txt
              ;;
          esac
      - name: Download RIR data
        run: aria2c -x 16 -s 16 -j 5 --dir=raw_data --input-file=urls.txt
      - name: Parse source records
        run: go run ./cmd/parse-rir ${{ matrix.rir }}
      - uses: actions/upload-artifact@v4
        with:
          name: data-${{ matrix.rir }}
          path: |
            allocations_${{ matrix.rir }}.csv
            routes_${{ matrix.rir }}.csv
            autnums_${{ matrix.rir }}.csv
          retention-days: 1
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: geofeeds-${{ matrix.rir }}
          path: geofeeds_${{ matrix.rir }}.txt
          retention-days: 1
          if-no-files-found: error

  prepare-geofeeds:
    name: Prepare geofeed locations
    needs: parse-rir
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
      - uses: actions/download-artifact@v4
        with:
          pattern: geofeeds-*
          path: artifacts
          merge-multiple: true
      - name: Merge geofeed sources
        run: |
          mkdir final_data
          touch artifacts/geofeeds_dummy.txt
          cat artifacts/geofeeds_*.txt | sort -u > final_data/geofeeds.txt
      - name: Fetch geofeeds
        run: go run ./cmd/fetch-geofeeds
      - uses: actions/upload-artifact@v4
        with:
          name: geofeed-locations
          path: final_data/geolocations.csv
          compression-level: 1
          retention-days: 1
          if-no-files-found: error

  build-database:
    name: Build pre-indexed ${{ matrix.format }} database
    needs: [release-metadata, parse-rir, prepare-geofeeds]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - format: bbolt
            database: mehrnet_bgp.bbolt
            asset: mehrnet_bgp_bbolt.tar.zst
          - format: sqlite
            database: mehrnet_bgp.db
            asset: mehrnet_bgp_sqlite.tar.zst
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
      - uses: actions/download-artifact@v4
        with:
          pattern: data-*
          path: artifacts
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          name: geofeed-locations
          path: final_data
      - name: Merge parser output
        run: |
          cat artifacts/allocations_*.csv > final_data/allocations.csv
          cat artifacts/routes_*.csv > final_data/routes.csv
          cat artifacts/autnums_*.csv > final_data/autnums.csv
          test -s final_data/geolocations.csv
      - name: Build immutable bbolt database
        if: matrix.format == 'bbolt'
        env:
          RELEASE_TAG: ${{ needs.release-metadata.outputs.release_tag }}
          DATASET_BUILT_AT: ${{ needs.release-metadata.outputs.dataset_built_at }}
        run: |
          go build -trimpath -o build-bbolt-dataset ./cmd/build-bbolt-dataset
          ./build-bbolt-dataset \
            -input final_data \
            -output mehrnet_bgp.bbolt \
            -release-tag "$RELEASE_TAG" \
            -built-at "$DATASET_BUILT_AT" \
            -source-commit "$GITHUB_SHA" \
            -compact=true
          test -s mehrnet_bgp.bbolt
      - name: Validate bbolt runtime contract
        if: matrix.format == 'bbolt'
        env:
          BGP_API_DATABASE_PATH: ${{ github.workspace }}/mehrnet_bgp.bbolt
          BGP_API_VALIDATE_ONLY: "1"
        run: |
          go test ./internal/api ./internal/boltstore
          go build -trimpath -o bgp-api ./cmd/bgp-api
          ./bgp-api
      - name: Build immutable SQLite database
        if: matrix.format == 'sqlite'
        env:
          RELEASE_TAG: ${{ needs.release-metadata.outputs.release_tag }}
          DATASET_BUILT_AT: ${{ needs.release-metadata.outputs.dataset_built_at }}
        run: |
          go build -trimpath -o build-sqlite-dataset ./cmd/build-sqlite-dataset
          go build -trimpath -o build-prefix-index ./cmd/build-prefix-index
          go build -trimpath -o build-range-summaries ./cmd/build-range-summaries
          go build -trimpath -o validate-database ./cmd/validate-database
          ./build-sqlite-dataset \
            -input final_data \
            -output mehrnet_bgp.db \
            -release-tag "$RELEASE_TAG" \
            -built-at "$DATASET_BUILT_AT" \
            -source-commit "$GITHUB_SHA"
          ./build-prefix-index mehrnet_bgp.db
          ./build-range-summaries mehrnet_bgp.db
          ./validate-database -indexed mehrnet_bgp.db
          test -s mehrnet_bgp.db
      - name: Compress and upload database
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.release-metadata.outputs.release_tag }}
        run: |
          tar --create --file - "${{ matrix.database }}" | zstd --threads=0 -3 --stdout > "${{ matrix.asset }}"
          sha256sum "${{ matrix.asset }}" > "checksum-${{ matrix.format }}.txt"
          gh release upload "$RELEASE_TAG" "${{ matrix.asset }}" --clobber
      - uses: actions/upload-artifact@v4
        with:
          name: checksum-${{ matrix.format }}
          path: checksum-${{ matrix.format }}.txt
          retention-days: 1
          if-no-files-found: error

  build-api-binaries:
    name: Build static API binaries
    needs: release-metadata
    runs-on: ubuntu-latest
    outputs:
      amd64_sha: ${{ steps.assets.outputs.amd64_sha }}
      arm64_sha: ${{ steps.assets.outputs.arm64_sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
      - name: Build static Linux binaries
        env:
          RELEASE_TAG: ${{ needs.release-metadata.outputs.release_tag }}
          DATASET_BUILT_AT: ${{ needs.release-metadata.outputs.dataset_built_at }}
        run: |
          mkdir -p release/bin
          for arch in amd64 arm64; do
            binary="bgp-api-linux-${arch}"
            CGO_ENABLED=0 GOOS=linux GOARCH="$arch" go build -trimpath \
              -ldflags="-s -w -X main.version=${RELEASE_TAG} -X main.commit=${GITHUB_SHA} -X main.builtAt=${DATASET_BUILT_AT}" \
              -o "release/bin/$binary" ./cmd/bgp-api
            tar -C release/bin -czf "release/${binary}.tar.gz" "$binary"
            rm "release/bin/$binary"
          done
      - name: Upload binaries
        id: assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.release-metadata.outputs.release_tag }}
        run: |
          {
            echo "amd64_sha=$(sha256sum release/bgp-api-linux-amd64.tar.gz | cut -d ' ' -f 1)"
            echo "arm64_sha=$(sha256sum release/bgp-api-linux-arm64.tar.gz | cut -d ' ' -f 1)"
          } >> "$GITHUB_OUTPUT"
          gh release upload "$RELEASE_TAG" release/*.tar.gz --clobber

  publish-release:
    name: Publish database release
    needs: [release-metadata, build-database, build-api-binaries]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: checksum-*
          path: checksums
          merge-multiple: true
      - name: Write checksums
        env:
          AMD64_SHA: ${{ needs.build-api-binaries.outputs.amd64_sha }}
          ARM64_SHA: ${{ needs.build-api-binaries.outputs.arm64_sha }}
        run: |
          mkdir release
          {
            printf '%s  %s\n' "$AMD64_SHA" bgp-api-linux-amd64.tar.gz
            printf '%s  %s\n' "$ARM64_SHA" bgp-api-linux-arm64.tar.gz
            cat checksums/*.txt
          } > release/SHA256SUMS.txt
          if grep -q '^  ' release/SHA256SUMS.txt; then
            echo "one or more release asset checksums are missing" >&2
            exit 1
          fi
      - name: Verify and finalize draft release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.release-metadata.outputs.release_tag }}
          DATA_TAG: ${{ needs.release-metadata.outputs.data_tag }}
        run: |
          actual="$(gh release view "$RELEASE_TAG" --json isDraft,assets --jq '
            if .isDraft then [.assets[].name] | sort | .[]
            else error("release is not a draft")
            end')"
          for asset in \
            bgp-api-linux-amd64.tar.gz \
            bgp-api-linux-arm64.tar.gz \
            mehrnet_bgp_bbolt.tar.zst \
            mehrnet_bgp_sqlite.tar.zst; do
            grep -Fxq "$asset" <<< "$actual" || {
              echo "draft release is missing $asset" >&2
              exit 1
            }
          done
          gh release upload "$RELEASE_TAG" release/SHA256SUMS.txt --clobber
          cat > release/release-notes.md <<'EOF'
          Immutable, fully indexed MehrNet BGP datasets.

          - `mehrnet_bgp_bbolt.tar.zst` contains the ready-to-query bbolt database. No import or index build is required on the API server.
          - `mehrnet_bgp_sqlite.tar.zst` contains the ready-to-query SQLite database for third-party users and offline inspection.
          - `bgp-api-linux-amd64.tar.gz` and `bgp-api-linux-arm64.tar.gz` contain statically linked API binaries.
          - `SHA256SUMS.txt` verifies every downloadable payload.
          EOF
          gh release edit "$RELEASE_TAG" \
            --title "MehrNet BGP Database - ${DATA_TAG}" \
            --notes-file release/release-notes.md \
            --draft=false \
            --latest
