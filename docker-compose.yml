services:
  postgres:
    image: ${BGP_API_POSTGRES_IMAGE:?set BGP_API_POSTGRES_IMAGE to a digest-pinned release image}
    restart: unless-stopped
    environment:
      POSTGRES_DB: bgp_api
    networks:
      - private
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d bgp_api"]
      interval: 10s
      timeout: 5s
      retries: 12

  api:
    image: ${BGP_API_IMAGE:?set BGP_API_IMAGE to a digest-pinned release image}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://bgp_api@postgres:5432/bgp_api?sslmode=disable
      LISTEN_ADDR: 0.0.0.0:3102
      ORIGIN_AUTH_TOKEN: ${ORIGIN_AUTH_TOKEN:?set ORIGIN_AUTH_TOKEN}
      TRUSTED_PROXY_CIDRS: ${TRUSTED_PROXY_CIDRS:-127.0.0.1/32,::1/128}
      CORS_ALLOWED_ORIGINS_JSON: ${CORS_ALLOWED_ORIGINS_JSON:-["https://bgp.mehrnet.com"]}
    ports:
      - 127.0.0.1:3102:3102
    networks:
      - private
      - edge

  sync:
    image: ${BGP_API_SYNC_IMAGE:?set BGP_API_SYNC_IMAGE to a digest-pinned release image}
    profiles: ["sync"]
    environment:
      DATABASE_URL: postgresql://postgres@postgres:5432/bgp_api?sslmode=disable
      BGP_API_GITHUB_REPOSITORY: ${BGP_API_GITHUB_REPOSITORY:-mehrnet/bgp-api}
      BGP_API_GITHUB_TOKEN: ${BGP_API_GITHUB_TOKEN:-}
      BGP_API_SYNC_MODE: patch
      BGP_API_SYNC_BINARY: "0"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - private
      - egress

networks:
  private:
    internal: true
  edge:
  egress:
